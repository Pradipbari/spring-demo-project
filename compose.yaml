services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: spring-demo-project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    image: spring-demo-app
    ports:
      - "3002:3002"
    depends_on:
      - database

volumes:
  postgres-data: